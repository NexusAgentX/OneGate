<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .header h1 {
      font-size: 18px;
      color: #58a6ff
    }

    .header .info {
      font-size: 12px;
      color: #8b949e
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    .toolbar h2 {
      font-size: 14px;
      color: #8b949e
    }

    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s
    }

    .btn:hover {
      background: #30363d
    }

    .btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #fff
    }

    .btn-primary:hover {
      background: #2ea043
    }

    .btn-danger {
      background: #da3633;
      border-color: #f85149;
      color: #fff
    }

    .btn-danger:hover {
      background: #f85149
    }

    .btn-sm {
      padding: 3px 10px;
      font-size: 12px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden
    }

    th {
      background: #21262d;
      padding: 10px 14px;
      text-align: center;
      color: #8b949e;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    td {
      padding: 10px 14px;
      border-top: 1px solid #21262d;
      font-size: 13px;
      vertical-align: middle;
      text-align: center
    }

    tr:hover td {
      background: #1c2128
    }

    .token-cell {
      text-align: left;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #79c0ff
    }

    .providers-cell {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center
    }

    .tag {
      background: #1f2937;
      border: 1px solid #30363d;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: #c9d1d9
    }

    .tag-all {
      border-color: #238636;
      color: #3fb950
    }

    .tag-admin {
      border-color: #a371f7;
      color: #a371f7
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600
    }

    .badge-admin {
      background: #1f1035;
      color: #a371f7;
      border: 1px solid #a371f7
    }

    .badge-user {
      background: #0d1117;
      color: #8b949e;
      border: 1px solid #30363d
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0
    }

    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #30363d;
      transition: .2s;
      border-radius: 20px
    }

    .toggle .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: #8b949e;
      transition: .2s;
      border-radius: 50%
    }

    .toggle input:checked+.slider {
      background: #238636
    }

    .toggle input:checked+.slider:before {
      transform: translateX(16px);
      background: #fff
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .6);
      z-index: 100;
      justify-content: center;
      align-items: center
    }

    .modal-overlay.active {
      display: flex
    }

    .confirm-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .6);
      z-index: 300;
      justify-content: center;
      align-items: center
    }

    .confirm-overlay.active {
      display: flex
    }

    .confirm-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 360px;
      max-width: 90vw
    }

    .confirm-box p {
      font-size: 14px;
      color: #c9d1d9;
      margin-bottom: 20px;
      word-break: break-all
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end
    }

    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 420px;
      max-width: 90vw
    }

    .modal h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #c9d1d9
    }

    .form-group {
      margin-bottom: 14px
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .form-group input[type=text] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #c9d1d9;
      cursor: pointer;
      padding: 4px 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      transition: background .15s
    }

    .checkbox-group label:hover {
      background: #1c2128
    }

    .checkbox-group input[type=checkbox] {
      accent-color: #238636
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #484f58;
      font-size: 14px
    }

    .copy-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      transition: background .15s
    }

    .copy-btn:hover {
      color: #58a6ff;
      background: #30363d
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .toast {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: #fff;
      opacity: 0;
      transform: translateX(40px);
      transition: opacity .3s, transform .3s;
      max-width: 400px;
      word-break: break-word
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0)
    }

    .toast-error {
      background: #da3633;
      border: 1px solid #f85149
    }

    .toast-success {
      background: #238636;
      border: 1px solid #2ea043
    }
  </style>
</head>

<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="header">
    <h1>Token Management</h1>
    <div class="info" id="stats"></div>
  </div>
  <div class="container">
    <div class="toolbar">
      <h2 id="token-count"></h2>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="loadTokens()">Refresh</button>
        <button class="btn btn-primary" onclick="showCreateModal()">+ New Token</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Token</th>
          <th>Providers</th>
          <th>Admin</th>
          <th>Enabled</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="token-tbody"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">New Token</h3>
      <div class="form-group">
        <label>Token (leave empty to auto-generate)</label>
        <input type="text" id="modal-token" placeholder="auto-generated">
      </div>
      <div class="form-group">
        <label>Providers</label>
        <div class="checkbox-group" id="modal-providers"></div>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px">
        <label style="margin:0;text-transform:none;font-size:13px;color:#c9d1d9">Admin</label>
        <label class="toggle">
          <input type="checkbox" id="modal-admin">
          <span class="slider"></span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="hideModal()">Cancel</button>
        <button class="btn btn-primary" id="modal-submit" onclick="submitModal()">Create</button>
      </div>
    </div>
  </div>

  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button class="btn" onclick="confirmCancel()">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok" onclick="confirmOk()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_TOKEN = /*__ADMIN_TOKEN__*/;
    const PROVIDERS = /*__PROVIDERS__*/;
    const API_BASE = '';
    let editingToken = null;

    function apiHeaders() {
      return { 'Content-Type': 'application/json', 'X-Admin-Token': ADMIN_TOKEN };
    }

    async function api(method, path, body) {
      const opts = { method, headers: apiHeaders() };
      if (body !== undefined && body !== null) opts.body = JSON.stringify(body);
      const resp = await fetch(API_BASE + path, opts);
      const data = await resp.json();
      return { ok: resp.ok, status: resp.status, data };
    }

    function toast(msg, type) {
      type = type || 'error';
      const el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    function fmtDate(ts) {
      if (!ts) return '-';
      const d = new Date(ts * 1000);
      return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function copyToken(token) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(token).then(() => {
          toast('Token copied', 'success');
        }).catch(() => {
          fallbackCopy(token);
        });
      } else {
        fallbackCopy(token);
      }
    }

    function fallbackCopy(token) {
      const ta = document.createElement('textarea');
      ta.value = token;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        toast('Token copied', 'success');
      } catch (e) {
        toast('Copy failed', 'error');
      }
      document.body.removeChild(ta);
    }

    function renderProviders(provs) {
      if (provs.includes('*')) return '<span class="tag tag-all">* (all)</span>';
      return provs.map(p => `<span class="tag">${esc(p)}</span>`).join('');
    }

    function renderRow(t) {
      const adminBadge = t.is_admin ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-user">User</span>';
      return `<tr data-token="${esc(t.token)}">
    <td class="token-cell">${esc(t.token)} <button class="copy-btn" onclick="copyToken('${esc(t.token)}')" title="Copy">copy</button></td>
    <td><div class="providers-cell">${renderProviders(t.providers)}</div></td>
    <td>${adminBadge}</td>
    <td>
      <label class="toggle">
        <input type="checkbox" ${t.enabled ? 'checked' : ''} onchange="toggleEnabled(this, '${esc(t.token)}')">
        <span class="slider"></span>
      </label>
    </td>
    <td style="font-size:12px;color:#8b949e">${fmtDate(t.created_at)}</td>
    <td>
      <button class="btn btn-sm" onclick="showEditModal('${esc(t.token)}')">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="confirmDelete('${esc(t.token)}')">Delete</button>
    </td>
  </tr>`;
    }

    async function loadTokens() {
      const { ok, data } = await api('GET', '/admin/api/tokens?token=' + encodeURIComponent(ADMIN_TOKEN));
      if (!ok) {
        toast(data.error || 'Failed to load tokens');
        return;
      }
      const tbody = document.getElementById('token-tbody');
      if (!data.tokens || data.tokens.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No tokens</td></tr>';
      } else {
        tbody.innerHTML = data.tokens.map(renderRow).join('');
      }
      const total = data.tokens ? data.tokens.length : 0;
      const admins = data.tokens ? data.tokens.filter(t => t.is_admin).length : 0;
      document.getElementById('token-count').textContent = `${total} token(s)`;
      document.getElementById('stats').textContent = `${admins} admin(s) / ${total} total`;
    }

    function buildProviderCheckboxes(containerId, selected) {
      const c = document.getElementById(containerId);
      const allOpts = ['*', ...PROVIDERS];
      c.innerHTML = allOpts.map(p => {
        const checked = selected.includes(p) ? 'checked' : '';
        return `<label><input type="checkbox" value="${esc(p)}" ${checked}>${esc(p === '*' ? '* (all)' : p)}</label>`;
      }).join('');
    }

    function getSelectedProviders(containerId) {
      const checks = document.querySelectorAll(`#${containerId} input[type=checkbox]:checked`);
      const vals = Array.from(checks).map(c => c.value);
      return vals.includes('*') ? ['*'] : vals;
    }

    function showCreateModal() {
      editingToken = null;
      document.getElementById('modal-title').textContent = 'New Token';
      document.getElementById('modal-token').value = '';
      document.getElementById('modal-token').disabled = false;
      document.getElementById('modal-admin').checked = false;
      buildProviderCheckboxes('modal-providers', ['*']);
      document.getElementById('modal-submit').textContent = 'Create';
      document.getElementById('modal-overlay').classList.add('active');
    }

    async function showEditModal(token) {
      const { ok, data } = await api('GET', '/admin/api/tokens?token=' + encodeURIComponent(ADMIN_TOKEN));
      if (!ok) {
        toast(data.error || 'Failed to load tokens');
        return;
      }
      const t = data.tokens ? data.tokens.find(x => x.token === token) : null;
      if (!t) return;
      editingToken = token;
      document.getElementById('modal-title').textContent = 'Edit Token';
      document.getElementById('modal-token').value = token;
      document.getElementById('modal-token').disabled = true;
      document.getElementById('modal-admin').checked = t.is_admin;
      buildProviderCheckboxes('modal-providers', t.providers);
      document.getElementById('modal-submit').textContent = 'Save';
      document.getElementById('modal-overlay').classList.add('active');
    }

    function hideModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    async function submitModal() {
      const provs = getSelectedProviders('modal-providers');
      const isAdmin = document.getElementById('modal-admin').checked;
      let result;
      if (!editingToken) {
        const customToken = document.getElementById('modal-token').value.trim();
        result = await api('POST', '/admin/api/tokens?token=' + encodeURIComponent(ADMIN_TOKEN), {
          token: customToken || undefined,
          providers: provs,
          is_admin: isAdmin,
        });
      } else {
        result = await api('PUT', '/admin/api/tokens/' + encodeURIComponent(editingToken) + '?token=' + encodeURIComponent(ADMIN_TOKEN), {
          providers: provs,
          is_admin: isAdmin,
        });
      }
      if (!result.ok) {
        toast(result.data.error || 'Operation failed');
        return;
      }
      hideModal();
      await loadTokens();
      toast(editingToken ? 'Token updated' : 'Token created', 'success');
    }

    async function toggleEnabled(checkbox, token) {
      const newVal = checkbox.checked;
      const result = await api('PUT', '/admin/api/tokens/' + encodeURIComponent(token) + '?token=' + encodeURIComponent(ADMIN_TOKEN), {
        enabled: newVal,
      });
      if (!result.ok) {
        toast(result.data.error || 'Failed to update');
        checkbox.checked = !newVal;
        return;
      }
      await loadTokens();
    }

    let _confirmResolve = null;

    function showConfirm(msg) {
      document.getElementById('confirm-message').textContent = msg;
      document.getElementById('confirm-overlay').classList.add('active');
      return new Promise(resolve => { _confirmResolve = resolve; });
    }

    function confirmOk() {
      document.getElementById('confirm-overlay').classList.remove('active');
      if (_confirmResolve) { _confirmResolve(true); _confirmResolve = null; }
    }

    function confirmCancel() {
      document.getElementById('confirm-overlay').classList.remove('active');
      if (_confirmResolve) { _confirmResolve(false); _confirmResolve = null; }
    }

    async function confirmDelete(token) {
      const ok = await showConfirm('Delete token ' + token.slice(0, 20) + '...?');
      if (ok) {
        await deleteToken(token);
      }
    }

    async function deleteToken(token) {
      const result = await api('DELETE', '/admin/api/tokens/' + encodeURIComponent(token) + '?token=' + encodeURIComponent(ADMIN_TOKEN));
      if (!result.ok) {
        toast(result.data.error || 'Failed to delete');
        return;
      }
      await loadTokens();
      toast('Token deleted', 'success');
    }

    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target === this) hideModal();
    });

    loadTokens();
  </script>
</body>

</html>
