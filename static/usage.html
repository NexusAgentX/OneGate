<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usage Query</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .header h1 {
      font-size: 18px;
      color: #58a6ff
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px
    }

    .card h3 {
      font-size: 13px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 14px
    }

    .form-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap
    }

    .form-group {
      flex: 1;
      min-width: 200px
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .form-group input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace
    }

    .form-group input:focus {
      outline: none;
      border-color: #58a6ff
    }

    .form-group input[type="datetime-local"] {
      font-family: inherit
    }

    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s;
      white-space: nowrap
    }

    .btn:hover {
      background: #30363d
    }

    .btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #fff
    }

    .btn-primary:hover {
      background: #2ea043
    }

    .btn-sm {
      padding: 4px 12px;
      font-size: 12px
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px
    }

    .summary-item {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 14px;
      text-align: center
    }

    .summary-item .value {
      font-size: 28px;
      font-weight: 700;
      color: #58a6ff
    }

    .summary-item .label {
      font-size: 11px;
      color: #8b949e;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .summary-item.current .value {
      color: #3fb950
    }

    .token-info {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 16px
    }

    .token-info code {
      color: #79c0ff;
      background: #0d1117;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      word-break: break-all
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      background: #21262d;
      padding: 8px 12px;
      text-align: left;
      color: #8b949e;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    td {
      padding: 6px 12px;
      border-top: 1px solid #21262d;
      font-size: 13px
    }

    tr:hover td {
      background: #1c2128
    }

    .bar-cell {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .bar-cell span {
      display: inline-block;
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .bar {
      height: 16px;
      background: #238636;
      border-radius: 3px;
      min-width: 2px;
      transition: width .3s
    }

    .error-msg {
      color: #f85149;
      font-size: 13px;
      padding: 8px 0
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #484f58;
      font-size: 14px
    }

    .providers-tag {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .tag {
      background: #1f2937;
      border: 1px solid #30363d;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: #c9d1d9
    }

    .tag-all {
      border-color: #238636;
      color: #3fb950
    }

    #results {
      display: none
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Usage Query</h1>
  </div>
  <div class="container">
    <div class="card">
      <h3>Query Parameters</h3>
      <div class="form-row">
        <div class="form-group" style="flex:2">
          <label>Token</label>
          <input type="text" id="input-token" placeholder="enter your proxy token...">
        </div>
        <div class="form-group">
          <label>Start (optional)</label>
          <input type="datetime-local" id="input-start">
        </div>
        <div class="form-group">
          <label>End (optional)</label>
          <input type="datetime-local" id="input-end">
        </div>
        <button class="btn btn-primary" onclick="queryUsage()">Query</button>
      </div>
      <div id="error" class="error-msg" style="display:none"></div>
    </div>

    <div id="results">
      <div class="card">
        <h3>Token Info</h3>
        <div class="token-info">
          Token: <code id="res-token"></code>
          <br>Providers: <span class="providers-tag" id="res-providers"></span>
        </div>
        <div class="summary-grid" id="summary-grid"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="margin:0">Hourly Breakdown</h3>
          <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#8b949e;cursor:pointer;user-select:none" onclick="document.getElementById('chk-local').click()">
            <input type="checkbox" id="chk-local" onchange="toggleTimezone()" style="accent-color:#58a6ff">Local Timezone
            (<span id="tz-name"></span>)
          </div>
        </div>
        <table>
          <thead>
            <tr id="hourly-header"></tr>
          </thead>
          <tbody id="hourly-body"></tbody>
        </table>
        <div id="hourly-empty" class="loading" style="display:none">No data in selected range</div>
      </div>
    </div>

    <div id="loading" class="loading" style="display:none">Loading...</div>
  </div>

  <script>
    const inputToken = document.getElementById('input-token');
    const inputStart = document.getElementById('input-start');
    const inputEnd = document.getElementById('input-end');

    inputToken.addEventListener('keydown', e => { if (e.key === 'Enter') queryUsage(); });

    async function queryUsage() {
      const token = inputToken.value.trim();
      if (!token) {
        showError('Please enter a token');
        return;
      }
      hideError();
      document.getElementById('results').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      const body = { token };
      if (inputStart.value) body.start = new Date(inputStart.value).toISOString();
      if (inputEnd.value) body.end = new Date(inputEnd.value).toISOString();

      try {
        const resp = await fetch('/usage/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        document.getElementById('loading').style.display = 'none';
        if (!resp.ok) {
          showError(data.error || 'Request failed');
          return;
        }
        renderResults(data);
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        showError('Network error: ' + e.message);
      }
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    let _lastData = null;

    document.getElementById('tz-name').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

    function toggleTimezone() {
      if (_lastData) renderHourly(_lastData);
    }

    function fmtHour(utcStr) {
      const useLocal = document.getElementById('chk-local').checked;
      if (!useLocal) return esc(utcStr);
      const d = new Date(utcStr);
      const pad = n => String(n).padStart(2, '0');
      return esc(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`);
    }

    function renderResults(data) {
      document.getElementById('results').style.display = 'block';
      document.getElementById('res-token').textContent = data.token;

      const provsEl = document.getElementById('res-providers');
      if (data.providers.includes('*')) {
        provsEl.innerHTML = '<span class="tag tag-all">* (all)</span>';
      } else {
        provsEl.innerHTML = data.providers.map(p => `<span class="tag">${esc(p)}</span>`).join('');
      }

      const summaryHtml = [
        { label: 'Range Total', value: data.total, cls: '' },
        { label: 'Last 24h', value: data.summary.last_24h, cls: 'current' },
        { label: 'Last 7d', value: data.summary.last_7d, cls: '' },
        { label: 'Last 30d', value: data.summary.last_30d, cls: '' },
      ].map(s => `<div class="summary-item ${s.cls}"><div class="value">${s.value}</div><div class="label">${s.label}</div></div>`).join('');
      document.getElementById('summary-grid').innerHTML = summaryHtml;

      const providerNames = Object.keys(data.current_hour.by_provider || {});
      if (providerNames.length === 0 && data.total === 0) {
        providerNames.push('default');
      }

      const allProvSet = new Set(providerNames);
      Object.values(data.hourly).forEach(h => Object.keys(h).forEach(p => allProvSet.add(p)));
      const allProv = [...allProvSet];

      const headerRow = document.getElementById('hourly-header');
      headerRow.innerHTML = '<th>Hour</th>' + allProv.map(p => `<th>${esc(p)}</th>`).join('') + '<th>Total</th>';

      _lastData = { hourly: data.hourly, allProv };
      renderHourly({ hourly: data.hourly, allProv });
    }

    function renderHourly({ hourly, allProv }) {
      const tbody = document.getElementById('hourly-body');
      const entries = Object.entries(hourly).reverse();

      if (entries.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('hourly-empty').style.display = 'block';
        return;
      }
      document.getElementById('hourly-empty').style.display = 'none';

      const maxVal = Math.max(...entries.map(([, h]) => allProv.reduce((s, p) => s + (h[p] || 0), 0)), 1);

      tbody.innerHTML = entries.map(([hour, counts]) => {
        const rowTotal = allProv.reduce((s, p) => s + (counts[p] || 0), 0);
        const pct = (rowTotal / maxVal * 100).toFixed(1);
        const provCells = allProv.map(p => {
          const v = counts[p] || 0;
          const pPct = (v / maxVal * 100).toFixed(1);
          return `<td><div class="bar-cell"><span>${v}</span><div class="bar" style="width:${pPct}%"></div></div></td>`;
        }).join('');
        return `<tr><td style="font-size:12px;color:#8b949e;white-space:nowrap">${fmtHour(hour)}</td>${provCells}<td><div class="bar-cell"><span>${rowTotal}</span><div class="bar" style="width:${pct}%;background:#58a6ff"></div></div></td></tr>`;
      }).join('');

      requestAnimationFrame(() => {
        let maxW = 0;
        tbody.querySelectorAll('.bar-cell span').forEach(sp => {
          sp.style.minWidth = '';
          maxW = Math.max(maxW, sp.offsetWidth);
        });
        if (maxW > 0) {
          tbody.querySelectorAll('.bar-cell span').forEach(sp => sp.style.minWidth = maxW + 'px');
        }
      });
    }
  </script>
</body>

</html>
